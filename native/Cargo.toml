[package]
name = "delta-core"
version = "0.1.0"
edition = "2021"
description = "Rust N-API core for Delta — vault filesystem, SQLite, file watching, search and ICS."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = [
    "napi4",
    "serde-json",
    "async",
    "tokio_rt",
] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
notify = "8"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "serde",
] }
chrono-tz = "0.10"
zip = { version = "9", default-features = false, features = ["deflate", "time"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
regex = "1"
anyhow = "1"
once_cell = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
# `noop` stubs the Node-API symbols so the crate can be linked into a plain
# test binary. It is only active for `cargo test`; release builds resolve the
# real symbols dynamically from the host process.
napi = { version = "3", default-features = false, features = [
    "napi4",
    "serde-json",
    "async",
    "tokio_rt",
    "noop",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
